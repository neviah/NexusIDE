name: Windows Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, stable]
  push:
    tags: ["v*-alpha.*", "v*-beta.*", "v*-stable.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
          cache: npm
          cache-dependency-path: code-oss/package-lock.json
      - name: Bootstrap Code-OSS
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Resolve release channel
        shell: pwsh
        run: |
          $channel = "${{ inputs.channel }}"
          if (-not $channel) {
            $channel = if ($env:GITHUB_REF_NAME -match '-(alpha|beta|stable)\.') { $Matches[1] } else { "alpha" }
          }
          "NEXUSIDE_RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
      - name: Import signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets[format('{0}{1}', 'NEXUSIDE_SIGNING_', 'CERTIFICATE_BASE64')] }}
        run: |
          if ($env:NEXUSIDE_RELEASE_CHANNEL -eq "alpha") { exit 0 }
          if (-not $env:SIGNING_CERTIFICATE_BASE64) { throw "Signed channels require NEXUSIDE_SIGNING_CERTIFICATE_BASE64." }
          $path = Join-Path $env:RUNNER_TEMP "nexuside-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "NEXUSIDE_SIGNING_CERTIFICATE=$path" >> $env:GITHUB_ENV
      - name: Build installer and portable package
        shell: pwsh
        env:
          NEXUSIDE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets[format('{0}{1}', 'NEXUSIDE_SIGNING_', 'CERTIFICATE_PASSWORD')] }}
        run: ./scripts/build-portable.ps1 -Channel $env:NEXUSIDE_RELEASE_CHANNEL
      - name: Verify artifacts
        shell: pwsh
        run: ./scripts/test-phase8-artifacts.ps1
      - name: Verify non-admin install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem .runtime/artifacts/NexusIDEUserSetup-x64-*.exe | Select-Object -First 1
          ./scripts/test-phase8-installer.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: NexusIDE-windows-x64
          path: |
            .runtime/artifacts/NexusIDEUserSetup-x64-*.exe
            .runtime/artifacts/NexusIDE-win32-x64-*.zip
            .runtime/artifacts/release.json
            .runtime/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .runtime/artifacts/NexusIDEUserSetup-x64-*.exe
            .runtime/artifacts/NexusIDE-win32-x64-*.zip
            .runtime/artifacts/release.json
            .runtime/artifacts/SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prerelease = if ($env:NEXUSIDE_RELEASE_CHANNEL -eq "stable") { @() } else { @("--prerelease") }
          gh release create "$env:GITHUB_REF_NAME" @prerelease --verify-tag --title "NexusIDE $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md .runtime/artifacts/NexusIDEUserSetup-x64-*.exe .runtime/artifacts/NexusIDE-win32-x64-*.zip .runtime/artifacts/release.json .runtime/artifacts/SHA256SUMS